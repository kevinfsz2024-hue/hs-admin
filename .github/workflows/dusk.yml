name: Laravel Dusk

on:
  push:
    branches: [ 2.0 ]
  pull_request:
    branches: [ 2.0 ]

jobs:
  laravel12:
    runs-on: ubuntu-latest
    name: Dusk (PHP 8.3 / Laravel 12)

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: laravel
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, gd, iconv, fileinfo
          coverage: none

      - name: Create Laravel 12 app
        run: composer create-project laravel/laravel laravel-tests ^12.0 --no-interaction --no-progress

      - name: Install dcat-admin
        run: sh ./tests/bin/install-dep.sh

      - name: Install admin
        run: sh ./tests/bin/install-admin.sh

      - name: Start server
        run: sh ./tests/bin/start.sh

      - name: Run dusk tests
        run: cd ./laravel-tests && php artisan dusk
